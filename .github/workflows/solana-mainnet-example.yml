name: Solana Mainnet released-package example

on:
  pull_request:
    paths:
      - 'examples/solana-mainnet-express/**'
      - '.github/workflows/solana-mainnet-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/solana-mainnet-express/**'
      - '.github/workflows/solana-mainnet-example.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/solana-mainnet-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/solana-mainnet-express/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
