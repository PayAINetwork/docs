name: Link check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links
        run: python3 scripts/check-links.py
      - name: Test link checker boundaries
        run: python3 scripts/test_check_links.py
      - name: Check v2 reference examples
        run: python3 scripts/check-reference.py
