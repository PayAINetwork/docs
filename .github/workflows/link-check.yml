name: Link check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check internal links
        run: python3 scripts/check-links.py
      - name: Test link checker boundaries
        run: python3 scripts/test_check_links.py
      - name: Check v2 reference examples
        run: python3 scripts/check-reference.py
      - name: Check plain guide indexes
        run: python3 scripts/check-guide-hubs.py
      - name: Test guide index regression guard
        run: python3 scripts/test_check_guide_hubs.py
      - name: Test isolated manual examples (no network or payments)
        run: |
          node --test scripts/test-manual-typescript.mjs
          python3 scripts/test_manual_python.py
