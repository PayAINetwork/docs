name: Validate examples

on:
  pull_request:
    paths:
      # All languages, not just typescript. check_deltas.py covers 11 pages
      # across ts/python/go, and the auth gate is built on the FastAPI page —
      # but this filter still said "typescript", so a PR touching only Python
      # or Go pages skipped every job here. #57 and #58 ran these gates only
      # because they happened to touch scripts/ as well.
      #
      # That gap was worst exactly where it was least visible: the Python and
      # Go delta is the FACILITATOR_URL line in the .env block, and upstream
      # falls back to x402.org/facilitator when it is unset — so losing it
      # breaks nothing loudly. check_deltas.py exists to catch that, and it
      # was not running on those pages.
      - "x402/servers/**"
      - "x402/clients/**"
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/validate-examples.yml"
  workflow_dispatch:

jobs:
  delta:
    name: PayAI delta intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_deltas.py

  live-payment:
    name: Live payment through the PayAI facilitator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fork PRs never see these secrets, and shouldn't.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: docs-live-payment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Boot the documented server, pay it with the documented client
        env:
          EVM_PRIVATE_KEY: ${{ secrets.TESTNET_EVM_PRIVATE_KEY }}
          SVM_PRIVATE_KEY: ${{ secrets.TESTNET_SVM_PRIVATE_KEY }}
          EVM_ADDRESS: ${{ secrets.TESTNET_EVM_ADDRESS }}
          SVM_ADDRESS: ${{ secrets.TESTNET_SVM_ADDRESS }}
        # --require: the wallets are provisioned, so a missing one is now a hard
        # failure rather than a silent skip. Without this the gate can quietly
        # stop testing anything the moment a secret is renamed or removed.
        run: python3 scripts/check_live_payment.py --require

  auth:
    name: Authenticated settlement (PayAI JWT)
    runs-on: ubuntu-latest
    # Not yet trusted as a merge gate. It failed on #57 and #58 for reasons I
    # could not reproduce locally, and a check that is red for unclear reasons
    # trains people to ignore it. It runs and reports; flip this off once a few
    # runs have been green and the failure mode is understood.
    continue-on-error: true
    timeout-minutes: 25
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: docs-live-payment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Boot the documented FastAPI server with the PayAI auth provider
        env:
          PAYAI_API_KEY_ID: ${{ secrets.PAYAI_API_KEY_ID }}
          PAYAI_API_KEY_SECRET: ${{ secrets.PAYAI_API_KEY_SECRET }}
          EVM_PRIVATE_KEY: ${{ secrets.TESTNET_EVM_PRIVATE_KEY }}
          SVM_PRIVATE_KEY: ${{ secrets.TESTNET_SVM_PRIVATE_KEY }}
          EVM_ADDRESS: ${{ secrets.TESTNET_EVM_ADDRESS }}
          SVM_ADDRESS: ${{ secrets.TESTNET_SVM_ADDRESS }}
        run: python3 scripts/check_auth_live.py --require
